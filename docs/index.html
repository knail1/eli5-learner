<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELI5 Learner</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6862; --accent:#0a5c8a; --line:#e4e1da; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141412; --fg:#ecebe6; --muted:#a09d95; --accent:#6cb6e0; --line:#2c2b28; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width: 680px; margin: 0 auto; padding: 56px 16px; }
  h1 { font: 700 2.4rem/1.1 -apple-system, "Helvetica Neue", Arial, sans-serif; margin:0 0 8px; letter-spacing:-.02em; }
  .dek { color:var(--muted); font-size:1.15rem; margin:0 0 32px; }
  h2 { font: 600 .8rem -apple-system, Arial, sans-serif; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); border-top:1px solid var(--line); padding-top:16px; }
  a { color:var(--accent); }
  li { margin: 6px 0; }
</style>
</head>
<body>
<main>
  <h1>ELI5 Learner</h1>
  <p class="dek">Turn dense source material into interactive HTML explainers: an in-depth view and an ELI5 view.</p>
  <h2>Samples</h2>
  <ul>
    <li><a href="sample/">Sample: How compound interest works</a></li>
  </ul>
  <h2>Project</h2>
  <p><a href="https://github.com/knail1/eli5-learner">github.com/knail1/eli5-learner</a></p>
</main>
</body>
</html>
