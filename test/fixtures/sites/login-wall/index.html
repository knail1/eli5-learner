<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in - Example Widgets Portal</title>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <p>Use your Example Widgets account to continue.</p>
      <form method="post" action="/session">
        <label>Email <input type="email" name="email" /></label>
        <label>Password <input type="password" name="password" /></label>
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
