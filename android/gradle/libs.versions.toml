# Resolved at S0 (2026-11-07) against dl.google.com/android/maven2 and repo1.maven.org metadata.
# Verified together in a smoke build (lint, Robolectric+Compose unit test, assembleDebug,
# R8 assembleRelease signed with the release key) on JDK 21, Gradle 9.8.2, SDK platform 37.0.
# Notes for S2:
# - Gradle 9.8.2 (bin zip SHA-256 21bd5da2de49b642904077f38c0efdc7778e92b3ed0889392dca61b97e389607,
#   wrapper jar SHA-256 3b8a25775a69158b5ad2b1d17a80a88dc7b40a352a73eb27d06c612a7ce68e98).
#   9.9.0 was released 2026-11-06 and is skipped as too new.
# - AGP 9 has built-in Kotlin: do NOT apply org.jetbrains.kotlin.android. Applying the compose
#   plugin at 2.4.21 lifts the Kotlin compiler and stdlib to 2.4.21.
# - Robolectric 4.17 on SDK 36 under JDK 21 needs, in testOptions.unitTests.all:
#   jvmArgs("--add-opens=java.base/java.io=ALL-UNNAMED",
#           "--add-exports=java.base/jdk.internal.access=ALL-UNNAMED")
# - compileSdk { version = release(37) } ; targetSdk 36 ; minSdk 31 ; build-tools 37.0.0.
# - Compose BOM 2026.09.00 maps material3 1.4.0, ui 1.12.1. Room 3 not adopted (stay on 2.8.x).

[versions]
agp = "9.5.1"
kotlin = "2.4.21"
ksp = "2.3.13"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
navigation3 = "1.2.1"
room = "2.8.5"
datastore = "1.3.0"
work = "2.12.0"
webkit = "1.18.0"
browser = "1.10.0"
okhttp = "5.5.1"
serializationJson = "1.12.0"
coroutines = "1.11.0"
playServicesAuth = "22.0.0"
junit = "4.13.2"
robolectric = "4.17"
androidxTestCore = "1.7.0"
