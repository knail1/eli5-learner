# Android companion CI (spec/tech/16-android-companion.md §11, §12). Its own workflow so the native
# `paths` filter can skip it when nothing the Android build reads has changed: the android/ project,
# the shared sync contract in test/contracts/, and the built documents the reader tests load from
# test/fixtures/documents/build/. Linux runner, JDK 21, no secrets, never signs or publishes a release:
# the release build uses the owner's key on the owner's Mac only.
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'test/contracts/**'
      - 'test/fixtures/documents/build/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'test/contracts/**'
      - 'test/fixtures/documents/build/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle (open-source basic cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Android SDK packages (compileSdk 37)
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Lint, JVM unit tests and debug build
        run: ./gradlew lint testDebugUnitTest assembleDebug --stacktrace
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
