# Public packaging (01 §8.3). Enterprise identity is bound privately (HOOK-CFG-02).
appId: io.github.eli5-learner
productName: ELI5 Learner
asar: true
asarUnpack:
  - '**/*.node'
directories:
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: resources
    to: .
  # pdf.js for the pdf-render window, served over eli5res://pdfjs/ (04 §6.3).
  - from: node_modules/pdfjs-dist/build
    to: pdfjs
    filter: [pdf.mjs, pdf.worker.mjs]
mac:
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing and notarization run only when credentials are present (01 §8.3). Without them
  # (CSC_IDENTITY_AUTO_DISCOVERY=false) the app stays unsigned; after-pack re-signs arm64 ad hoc.
  notarize: false
afterPack: scripts/after-pack.cjs
