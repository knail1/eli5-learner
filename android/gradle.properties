# Project-wide Gradle settings. Machine-specific and secret values (signing, SDK path) never go here:
# they live in ~/.gradle/gradle.properties, the environment, or the git-ignored local.properties.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
